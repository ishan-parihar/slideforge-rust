[package]
name = "slideforge-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
anyrender = "0.11"
anyrender_vello_cpu = "0.14"
base64 = "0.22"
reqwest = { version = "0.13", features = ["blocking"] }
blitz-dom = "=0.3.0-beta.1"
blitz-html = "=0.3.0-beta.1"
blitz-net = "=0.3.0-beta.1"
blitz-paint = "=0.3.0-beta.1"
blitz-traits = "=0.3.0-beta.1"
clap = { version = "4.6.1", features = ["derive"] }
indexmap = { version = "2.0", features = ["serde"] }
kurbo = "0.13"
palette = "0.7.6"
peniko = "0.6"
png = "0.17"
regex = "1.12"
resvg = "0.47.0"
rmcp = { version = "1.8.0", features = ["server", "macros"] }
schemars = { version = "1.2.1", features = ["indexmap2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiny-skia = "0.12.0"
tokio = { version = "1.52.3", features = ["full"] }
url = "2"
rand = "0.8"
uuid = { version = "1.17", features = ["v4"] }
qrcode = "0.14"

toon-helper = { path = "crates/toon-helper" }
