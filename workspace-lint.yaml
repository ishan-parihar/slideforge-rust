        - "__pycache__"
        - "_kernel"
        - "crates"
        - "dist"
        - "docs"
        - "examples"
        - "node_modules"
        - "nonexistent_dir"
        - "optional-skills"
        - "plans"
        - "plugins"
        - "scripts"
        - "skill"
        - "skills"
        - "src"
        - "stress_decks"
        - "target"
        - "target-musl"
