        - ".claude"
        - ".contexty"
        - ".cortexkit"
        - ".cursor"
        - ".devin"
        - ".gemini"
        - ".github"
        - ".grader"
        - ".hive"
        - ".impeccable"
        - ".memsearch"
        - ".oh-my-opencode"
