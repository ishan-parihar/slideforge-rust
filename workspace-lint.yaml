        - "crates"
        - "dist"
        - "docs"
        - "examples"
        - "node_modules"
        - "nonexistent_dir"
        - "optional-skills"
        - "plans"
        - "plugins"
        - "scripts"
        - "skill"
        - "skills"
        - "src"
        - "stress_decks"
        - "target"
        - "target-musl"
        - "test-drafts"
        - "vendor"
    "*.rs":
      preferred_dir: "src"
      exclude_dirs:
        - ".agents"
        - ".claude"
        - ".contexty"
        - ".cortexkit"
        - ".cursor"
        - ".devin"
        - ".gemini"
        - ".github"
        - ".grader"
        - ".hive"
        - ".impeccable"
        - ".memsearch"
