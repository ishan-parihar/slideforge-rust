project:
  name: "deckmill"
  type: "rust-mcp-and-clis"

structure:
  canonical:
    - path: "src"
      purpose: "Source code"
    - path: "crates"
      purpose: "Crate workspace"
    - path: "docs"
      purpose: "Documentation, audits, and plans"
    - path: "scripts"
      purpose: "Utility scripts"
    - path: "skills"
      purpose: "AI agent skills"
    - path: "dist"
      purpose: "Build output"

rules:
  root:
    forbidden_files:
      - "*.log"
      - "*.bak"
      - "*.tmp"
      - "*.old"
      - "*.orig"
      - "*.rej"
      - "*.swp"
      - "*.pid"
      - "*.out"
      - "*.err"
      - "*~"
      - "AUDIT*"
      - "PLAN*"
      - "*REPORT*"
      - "*_v[0-9]*"
      - "*ROADMAP*"
      - "*GUIDE*"
      - "*UPGRADE*"
      - "*DIAGNOSTICS*"
      - "*INTELLIGENCE*"
      - "TOOL_ANALYSIS*"
      - "IMPLEMENTATION_*"
      - "AGENT_GUIDE*"
      - "error.log"
      - "lifeos.config.json"
    allowed_root_files:
      - ".clippy.toml"
      - ".editorconfig"
      - ".env.example"
      - ".eslintrc*"
      - ".gitattributes"
      - ".gitignore"
      - ".gitmodules"
      - ".impeccable.md"
      - ".node-version"
      - ".nvmrc"
      - ".oh-my-opencode-pi-stats.json"
      - ".prettierrc*"
      - ".python-version"
      - ".rustfmt.toml"
      - "AGENTS.md"
      - "BUGS.md"
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "COPYING"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "Justfile"
      - "LICENSE"
      - "LICENSE-*"
      - "LICENSE.md"
      - "Makefile"
      - "NOTICE"
      - "Pipfile"
      - "README.md"
      - "SECURITY.md"
      - "SKILL.md"
      - "SLIDE_TYPE_AUDIT.md"
      - "TODO.md"
      - "VERSION"
      - "analyze_chrome.py"
      - "audit_slides.json"
      - "audit_tokens.json"
      - "blog_design_tokens.json"
      - "blog_slides.json"
      - "bun.lock"
      - "capacitor.config.json"
      - "clippy.toml"
      - "design_tokens.json"
      - "docker-compose.yaml"
      - "docker-compose.yml"
      - "gender_studies_slides.json"
      - "gender_studies_tokens.json"
      - "generate_all_types_test.py"
      - "generate_audit_slides.py"
      - "generate_blog_slide.py"
      - "generate_dataviz_test.py"
      - "generate_ellipsis_deck.py"
      - "generate_full_scope_test.py"
      - "generate_gender_studies_carousel.py"
      - "generate_habits_carousel.py"
      - "generate_maxlength_regression.py"
      - "generate_preset_slides.py"
      - "generate_random_styles_test.py"
      - "generate_remaining_types_test.py"
      - "generate_stress_test.py"
      - "generate_text_layout_test.py"
      - "generate_typology_test.py"
      - "go.mod"
      - "go.sum"
      - "habits_slides.json"
      - "install.sh"
      - "lifeos.config.default.json"
      - "measure_chrome.py"
      - "measure_overflow.py"
      - "package-lock.json"
      - "package.json"
      - "plan.md"
      - "pnpm-lock.yaml"
