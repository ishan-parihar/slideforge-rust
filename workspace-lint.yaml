      - "tsup.config.ts"
      - "vite.config.ts"
      - "workspace-lint.yaml"
      - "wrangler.toml"
      - "yarn.lock"

  files:
    "*.md":
      preferred_dir: "docs"
      exclude_dirs:
        - ".agents"
        - ".claude"
        - ".contexty"
        - ".cortexkit"
        - ".cursor"
        - ".devin"
        - ".gemini"
        - ".github"
        - ".grader"
        - ".hive"
        - ".impeccable"
        - ".memsearch"
        - ".oh-my-opencode"
        - ".plans"
        - ".serena"
        - ".sisyphus"
