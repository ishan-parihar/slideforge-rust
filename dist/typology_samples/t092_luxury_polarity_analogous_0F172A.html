html: "<div style=\"position:relative;width:100%;height:100%;background:radial-gradient(at 40% 20%, #0F172A15 0px, transparent 50%), radial-gradient(at 80% 0%, #20160110 0px, transparent 50%), radial-gradient(at 0% 50%, #6C778F12 0px, transparent 50%), var(--surface-light);background-color:var(--surface-light);overflow:hidden;\">\n            <div style=\"inset: 0; background: var(--texture-grain); position: absolute; pointer-events: none; opacity: 0.04; z-index: 1\"></div>\n            \n            <div class=\"slide-content\" style=\"position:relative;z-index:10;padding:80px 44px 80px;display:flex;flex-direction:column;justify-content:center;height:100%;width:100%;box-sizing:border-box;\">\n                <div style=\"border-radius: 0; background: #F5F3FFCC; border: 1px solid #C3C7D140;padding:var(--space-4);box-shadow:0 26px 39px -3px rgba(0,0,0,0.08), 0 10px 15px -4px rgba(0,0,0,0.05);\"><div style=\"font-family:Georgia,serif;font-size:64px;line-height:1;color:#0F172A30;text-align:center;margin-bottom:-8px;user-select:none;\" aria-hidden=\"true\">❝</div><blockquote style=\"font-family:Cormorant Garamond;font-size:113px;font-weight:600;line-height:1.25;color:#090B0F;margin:0;text-align:center;text-wrap:balance;font-style:italic;\">Design is the silent language of trust.</blockquote><div style=\"margin-top:12px;text-align:center;\"></div></div>\n            </div>\n        </div>"
